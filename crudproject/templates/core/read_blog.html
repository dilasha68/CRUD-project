<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ obj.title }}</title>
</head>
<body>
    <main>
        <h1>{{ obj.title }}</h1>
        <p>By {{ obj.author }} · {{ obj.date_of_post|date:"Y-m-d H:i" }}</p>
        <p>{{ obj.content }}</p>
        <a href="{% url 'home' %}">Back to all posts</a>
    </main>
</body>
</html>
