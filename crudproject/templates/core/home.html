<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django Blog CRUD</title>
</head>
<body>
    <main>
        <h1>Blog posts</h1>
        {% if data %}
            <ul>
                {% for obj in data %}
                    <li>
                        <strong>{{ obj.title }}</strong> by {{ obj.author }}
                        <a href="{% url 'read_one' id=obj.id %}">Read</a>
                        <a href="{% url 'update_one' id=obj.id %}">Edit</a>
                        <a href="{% url 'delete_one' id=obj.id %}">Delete</a>
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <p>No posts yet.</p>
        {% endif %}

        <h2>Create a blog post</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Create post</button>
        </form>
    </main>
</body>
</html>
